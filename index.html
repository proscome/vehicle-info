<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>車両情報検索</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f3f5f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0 18px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 12px;
      font-size: 17px;
      border: 1px solid #c9ced4;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #3578e5;
      box-shadow: 0 0 0 2px rgba(53, 120, 229, 0.15);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .primary-button {
      width: 100%;
      margin-top: 16px;
      background: #2563eb;
      color: white;
    }

    .primary-button:active {
      background: #1d4ed8;
    }

    .secondary-button {
      background: #e5e7eb;
      color: #222;
    }

    .danger-button {
      background: #fee2e2;
      color: #b91c1c;
    }

    .history-title {
      margin-top: 22px;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .history-select-button {
      flex: 1;
      text-align: left;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #d8dee6;
      padding: 10px 12px;
      font-size: 15px;
    }

    .history-select-button:active {
      background: #dbeafe;
    }

    .history-delete-button {
      flex: 0 0 42px;
      padding: 8px 0;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      font-size: 18px;
    }

    .history-delete-button:active {
      background: #fee2e2;
    }

    .clear-history-button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      font-size: 14px;
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #d1d5db;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 14px;
      padding: 13px;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 14px;
      line-height: 1.6;
    }

    .error-message {
      background: #fef2f2;
      color: #b91c1c;
    }

    .search-info {
      margin-bottom: 14px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .result-table th,
    .result-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 8px;
      vertical-align: top;
      line-height: 1.55;
      text-align: left;
    }

    .result-table th {
      width: 42%;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
    }

    .result-table td {
      width: 58%;
      font-size: 14px;

      /* JSON内の改行を表示 */
      white-space: pre-line;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .back-button {
      width: 100%;
      margin-top: 16px;
      background: #e5e7eb;
      color: #222;
    }

    .footer {
      text-align: right;
      margin-top: 18px;
      padding-right: 4px;
      color: #777;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .footer img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 4px;
      opacity: 0.85;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    @media (max-width: 400px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>車両情報検索</h1>

    <!-- メーカー入力画面 -->
    <div id="manufacturerStep" class="card">
      <div class="card-title">車名を入力</div>

      <label for="manufacturerInput">
        車検証表現の車名（メーカー名）
      </label>

      <input
        type="text"
        id="manufacturerInput"
        placeholder="例：日野、三菱、UD、いすゞ"
        autocomplete="off"
      >

      <button
        id="manufacturerNextButton"
        class="primary-button"
      >
        次へ
      </button>

      <div id="historyArea" class="hidden">
        <div class="history-title">最近使用した車名</div>
        <div id="historyList" class="history-list"></div>

        <button
          id="clearHistoryButton"
          class="clear-history-button"
        >
          履歴をすべて消去
        </button>
      </div>
    </div>

    <!-- 型式入力画面 -->
    <div id="modelStep" class="card hidden">
      <div class="card-title">型式を入力</div>

      <label for="modelInput">
        排ガス記号 ＋ 型式
      </label>

      <input
        type="text"
        id="modelInput"
        placeholder="例：2RG-FEA20"
        autocomplete="off"
      >

      <button
        id="searchButton"
        class="primary-button"
      >
        検索
      </button>

      <button
        id="backButton"
        class="back-button"
      >
        車名入力に戻る
      </button>
    </div>

    <!-- 検索条件 -->
    <div id="searchInfo" class="card search-info hidden"></div>

    <!-- 結果 -->
    <div id="resultCard" class="card hidden">
      <div class="card-title">検索結果</div>

      <table class="result-table">
        <tbody id="resultBody"></tbody>
      </table>

      <button
        id="resultBackButton"
        class="back-button"
      >
        車名入力に戻る
      </button>
    </div>

    <!-- メッセージ -->
    <div id="message" class="message hidden"></div>

    <div class="footer">
      <span class="footer-brand">
        <img
          src="icons/proscome-icon.png"
          alt="PROSCOME"
        >
        PROSCOME
      </span>
    </div>

  </div>

  <script>
    "use strict";

    let vehicles = [];

    const HISTORY_KEY = "vehicleInfoManufacturerHistory";
    const MAX_HISTORY = 10;

    const manufacturerStep =
      document.getElementById("manufacturerStep");

    const modelStep =
      document.getElementById("modelStep");

    const manufacturerInput =
      document.getElementById("manufacturerInput");

    const modelInput =
      document.getElementById("modelInput");

    const manufacturerNextButton =
      document.getElementById("manufacturerNextButton");

    const searchButton =
      document.getElementById("searchButton");

    const backButton =
      document.getElementById("backButton");

    const resultBackButton =
      document.getElementById("resultBackButton");

    const historyArea =
      document.getElementById("historyArea");

    const historyList =
      document.getElementById("historyList");

    const clearHistoryButton =
      document.getElementById("clearHistoryButton");

    const searchInfo =
      document.getElementById("searchInfo");

    const resultCard =
      document.getElementById("resultCard");

    const resultBody =
      document.getElementById("resultBody");

    const message =
      document.getElementById("message");


    /*
     * vehicle.json 読み込み
     */
    async function loadVehicles() {
      try {
        const response = await fetch(
          "./vehicle.json",
          {
            cache: "no-cache"
          }
        );

        if (!response.ok) {
          throw new Error(
            "vehicle.json の読み込みに失敗しました。"
          );
        }

        const data = await response.json();

        if (
          !data ||
          !Array.isArray(data.vehicles)
        ) {
          throw new Error(
            "vehicle.json に vehicles 配列がありません。"
          );
        }

        vehicles = data.vehicles;

      } catch (error) {
        console.error(error);

        showMessage(
          "車両データを読み込めませんでした。vehicle.json の配置を確認してください。",
          true
        );
      }
    }


    /*
     * メーカー名変換
     *
     * 元VBAのSelect Caseを再現
     *
     * 追加：
     * 半角UD → 全角ＵＤ
     */
    function convertManufacturer(value) {
      const original = String(value ?? "").trim();

      switch (original) {
        case "いすず":
          return "いすゞ";

        case "ふそう":
        case "三菱":
          return "三菱ふそう";

        case "ＵＤトラックス":
        case "UDトラックス":
        case "日産ディーゼル":
        case "ニッサンディーゼル":
        case "ＵＤ":
        case "UD":
          return "ＵＤ";

        case "ニッサン":
        case "日産":
          return "日産自動車";

        default:
          return original;
      }
    }


    /*
     * VBA Like用の正規表現変換
     *
     * 対応：
     * * ＝ 任意の文字列
     * ? ＝ 任意の1文字
     * # ＝ 数字1文字
     * [ABC] ＝ A/B/Cのいずれか
     * [!ABC] ＝ A/B/C以外
     */
    function vbaLikeToRegExp(pattern) {
      let result = "^";

      for (let i = 0; i < pattern.length; i++) {
        const ch = pattern[i];

        if (ch === "*") {
          result += ".*";

        } else if (ch === "?") {
          result += ".";

        } else if (ch === "#") {
          result += "[0-9]";

        } else if (ch === "[") {
          const closeIndex = pattern.indexOf("]", i + 1);

          if (closeIndex !== -1) {
            let content = pattern.substring(
              i + 1,
              closeIndex
            );

            if (content.startsWith("!")) {
              content = "^" + content.substring(1);
            }

            result += "[" + content + "]";
            i = closeIndex;

          } else {
            result += "\\[";
          }

        } else {
          result += ch.replace(
            /[\\^$+{}()|.]/g,
            "\\$&"
          );
        }
      }

      result += "$";

      return new RegExp(result, "i");
    }


    /*
     * VBA Like判定
     *
     * Option Compare Text相当で大文字小文字を無視
     */
    function vbaLike(value, pattern) {
      try {
        const regex = vbaLikeToRegExp(pattern);
        return regex.test(value);
      } catch (error) {
        console.error(
          "Like判定エラー:",
          value,
          pattern,
          error
        );

        return false;
      }
    }


    /*
     * 全角スペース除去
     *
     * VBAのQ/R列に対するReplace("　", "")相当
     */
    function removeFullWidthSpaces(value) {
      return String(value ?? "").replace(/　/g, "");
    }


    /*
     * 履歴取得
     */
    function getHistory() {
      try {
        const history =
          JSON.parse(
            localStorage.getItem(HISTORY_KEY) || "[]"
          );

        if (Array.isArray(history)) {
          return history;
        }

        return [];

      } catch (error) {
        console.error(error);
        return [];
      }
    }


    /*
     * 履歴保存
     */
    function saveHistory(history) {
      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
      );
    }


    /*
     * 履歴に追加
     *
     * 最新を先頭
     * 重複削除
     * 最大10件
     */
    function addHistory(value) {
      const manufacturer = String(value ?? "").trim();

      if (!manufacturer) {
        return;
      }

      let history = getHistory();

      history = history.filter(
        item => item !== manufacturer
      );

      history.unshift(manufacturer);

      history = history.slice(
        0,
        MAX_HISTORY
      );

      saveHistory(history);
      renderHistory();
    }


    /*
     * 履歴の個別削除
     */
    function deleteHistoryItem(index) {
      const history = getHistory();

      if (
        index < 0 ||
        index >= history.length
      ) {
        return;
      }

      history.splice(index, 1);

      saveHistory(history);
      renderHistory();
    }


    /*
     * 履歴全消去
     */
    function clearAllHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }


    /*
     * 履歴表示
     */
    function renderHistory() {
      const history = getHistory();

      historyList.innerHTML = "";

      if (history.length === 0) {
        historyArea.classList.add("hidden");
        return;
      }

      historyArea.classList.remove("hidden");

      history.forEach((item, index) => {
        const row =
          document.createElement("div");

        row.className = "history-item";

        const selectButton =
          document.createElement("button");

        selectButton.className =
          "history-select-button";

        selectButton.textContent = item;

        selectButton.addEventListener(
          "click",
          () => {
            manufacturerInput.value = item;
            manufacturerInput.focus();
          }
        );

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "history-delete-button";

        deleteButton.textContent = "×";
        deleteButton.title = "この履歴を削除";

        deleteButton.addEventListener(
          "click",
          () => {
            deleteHistoryItem(index);
          }
        );

        row.appendChild(selectButton);
        row.appendChild(deleteButton);

        historyList.appendChild(row);
      });
    }


    /*
     * メッセージ表示
     */
    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.remove("hidden");

      if (isError) {
        message.classList.add("error-message");
      } else {
        message.classList.remove("error-message");
      }
    }


    /*
     * メッセージ非表示
     */
    function hideMessage() {
      message.textContent = "";
      message.classList.add("hidden");
      message.classList.remove("error-message");
    }


    /*
     * 結果非表示
     */
    function hideResult() {
      resultCard.classList.add("hidden");
      resultBody.innerHTML = "";
    }


    /*
     * メーカー入力画面へ戻る
     */
    function showManufacturerStep() {
      modelStep.classList.add("hidden");
      manufacturerStep.classList.remove("hidden");

      hideMessage();
      hideResult();

      searchInfo.classList.add("hidden");

      // 次回入力に備えて空欄にする
      manufacturerInput.value = "";
      modelInput.value = "";

      manufacturerInput.focus();
    }


    /*
     * 型式入力画面へ
     */
    function showModelStep() {
      manufacturerStep.classList.add("hidden");
      modelStep.classList.remove("hidden");

      hideMessage();
      hideResult();

      searchInfo.classList.add("hidden");

      modelInput.value = "";
      modelInput.focus();
    }


    /*
     * VBAと同じ検索処理
     *
     * 1. メーカー名変換
     * 2. 型式が「不明」または空欄なら "-"
     * 3. JSON上から上から順番に検索
     * 4. メーカー一致
     * 5. VBA Like一致
     * 6. 最初の1件で終了
     */
    function findVehicle(
      manufacturerInputValue,
      modelInputValue
    ) {
      const cn =
        convertManufacturer(
          manufacturerInputValue
        );

      let kata =
        String(modelInputValue ?? "").trim();

      if (
        kata === "不明" ||
        kata === ""
      ) {
        kata = "-";
      }

      for (const vehicle of vehicles) {
        const tcn =
          String(
            vehicle.manufacturer ?? ""
          );

        const tkata =
          String(
            vehicle.emission ?? ""
          ) +
          "-" +
          String(
            vehicle.model ?? ""
          );

        if (
          cn === tcn &&
          vbaLike(kata, tkata)
        ) {
          return vehicle;
        }
      }

      return null;
    }


    /*
     * 結果表示
     */
    function showResult(vehicle) {
      resultBody.innerHTML = "";

      const fields = [
        ["車速信号", vehicle.speedSignal],
        ["車速パルス", vehicle.speedPulse],
        ["車速取得場所", vehicle.speedLocation],
        ["エンジン回転信号", vehicle.engineSignal],
        ["エンジン回転パルス", vehicle.enginePulse],
        ["エンジン回転取得場所", vehicle.engineLocation]
      ];

      fields.forEach(([label, value]) => {
        const tr =
          document.createElement("tr");

        const th =
          document.createElement("th");

        th.textContent = label;

        const td =
          document.createElement("td");

        // textContentを使うことで安全に表示
        // white-space: pre-lineで改行反映
        td.textContent =
          value === null ||
          value === undefined
            ? ""
            : String(value);

        tr.appendChild(th);
        tr.appendChild(td);

        resultBody.appendChild(tr);
      });

      resultCard.classList.remove("hidden");
    }


    /*
     * メーカー「次へ」
     */
    manufacturerNextButton.addEventListener(
      "click",
      () => {
        const manufacturer =
          manufacturerInput.value.trim();

        if (!manufacturer) {
          showMessage(
            "メーカー名を入力してください。"
          );

          manufacturerInput.focus();
          return;
        }

        addHistory(manufacturer);
        showModelStep();
      }
    );


    /*
     * Enterキーでメーカー次へ
     */
    manufacturerInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          manufacturerNextButton.click();
        }
      }
    );


    /*
     * 検索
     */
    searchButton.addEventListener(
      "click",
      () => {
        hideMessage();
        hideResult();

        const manufacturer =
          manufacturerInput.value.trim();

        const model =
          modelInput.value.trim();

        if (!manufacturer) {
          showMessage(
            "メーカー名が入力されていません。"
          );

          return;
        }

        if (!model) {
          showMessage(
            "排ガス記号・型式を入力してください。"
          );

          modelInput.focus();
          return;
        }

        const convertedManufacturer =
          convertManufacturer(manufacturer);

        searchInfo.textContent =
          "検索条件："
          + convertedManufacturer
          + " / "
          + model;

        searchInfo.classList.remove("hidden");

        const vehicle =
          findVehicle(
            manufacturer,
            model
          );

        if (!vehicle) {
          showMessage(
            "まだ登録されていない型式の可能性があります。"
          );

          return;
        }

        showResult(vehicle);
      }
    );


    /*
     * Enterキーで検索
     */
    modelInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          searchButton.click();
        }
      }
    );


    /*
     * 戻る
     */
    backButton.addEventListener(
      "click",
      showManufacturerStep
    );

    resultBackButton.addEventListener(
      "click",
      showManufacturerStep
    );


    /*
     * 履歴全消去
     */
    clearHistoryButton.addEventListener(
      "click",
      () => {
        const history = getHistory();

        if (history.length === 0) {
          return;
        }

        const confirmed =
          window.confirm(
            "メーカー入力履歴をすべて消去しますか？"
          );

        if (confirmed) {
          clearAllHistory();
        }
      }
    );


    /*
     * 初期処理
     */
    renderHistory();
    loadVehicles();


    /*
     * Service Worker登録
     */
    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker.register(
            "./sw.js"
          ).catch(error => {
            console.error(
              "Service Worker登録失敗:",
              error
            );
          });
        }
      );
    }

  </script>
</body>
</html>
